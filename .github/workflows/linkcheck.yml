name: Registry link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe every tracker URL
        id: probe
        run: |
          set +e
          python tools/check_links.py > probe.out 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat probe.out
      - name: File issue on failure
        if: steps.probe.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Link check failed $(date -u +%F)"
          BODY="$(printf 'Run: %s\n\n```\n%s\n```' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(cat probe.out)")"
          gh issue create --title "$TITLE" --body "$BODY" --repo "$GITHUB_REPOSITORY"
      - name: Propagate failure
        if: steps.probe.outputs.exit_code != '0'
        run: exit 1

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # Re-enabling the workflow on every scheduled run resets that timer.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/linkcheck.yml/enable"
